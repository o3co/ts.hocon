name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Least-privilege: only the publish job needs write scope. Workflow-level
    # `permissions: {}` denies by default so future jobs added here don't
    # inherit write access without an explicit declaration.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          # Doc-canonical trusted-publishing setup (docs.npmjs.com
          # /trusted-publishers §Step 2): registry-url set, no caching in
          # release builds.
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Set version from tag
        # Idempotent: skip the bump if package.json is already at the tag's
        # version. `pnpm version X` errors with "Version not changed" if the
        # current version equals X, which broke v1.4.0 publish when the
        # release-prep PR pre-bumped package.json (see scope AGENTS.md
        # "Release version-bump convention").
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$CURRENT" ]; then
            pnpm version "$TAG_VERSION" --no-git-tag-version --no-commit-hooks
          else
            echo "package.json already at $CURRENT — skipping bump"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch expected JSON
        # xx.hocon ground-truth fixtures used by the conformance tests
        # (e.g. tests/lightbend/testdata/expected/unquoted-starts/*.json).
        # Without this step the test job fails with ENOENT before publish
        # — see #98 release-time regression where v1.2.0 publish was blocked.
        run: make testdata

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Extract CHANGELOG section for this tag
        # Pulls the section between `## [VERSION]` and the next `## [`
        # from CHANGELOG.md so the GitHub Release body matches what's
        # already committed and reviewed.
        #
        # Uses `index($0, str) == 1` (prefix match) rather than awk regex
        # so SemVer build metadata (`+...`) and other regex metacharacters
        # in version strings can't break or overmatch the section header.
        #
        # Runs BEFORE `pnpm publish` (and the GitHub Release step below)
        # so that a missing/incorrect CHANGELOG heading fails the run
        # without first publishing to npm — npm doesn't allow republishing
        # the same version, so an irreversible publish followed by a
        # failed release step would leave a half-shipped tag.
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && index($0, "## [") == 1 { flag=0 }
            flag
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG section found for v${VERSION}; aborting release so an empty body doesn't ship"
            exit 1
          fi

      - name: Create GitHub Release
        # Runs before `pnpm publish` so a Release-creation failure doesn't
        # leave us with an npm tarball published but no GitHub Release
        # entry (npm forbids republishing the same version, so a retry
        # would fail at `pnpm publish` and never reach this step again).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          fail_on_unmatched_files: false
          make_latest: true

      - name: Publish
        # OIDC trusted publishing (no NODE_AUTH_TOKEN): under `id-token: write`
        # the registry token exchange and sigstore provenance are signed from
        # the workflow's own OIDC identity. This is the setup that shipped every
        # release through v1.8.0. The token-auth / `env -u` workarounds tried in
        # between were chasing a 403 that npm confirmed was a registry-side
        # outage coinciding with the first v1.9.0 attempt, not a config fault.
        run: pnpm publish --access public --no-git-checks --provenance

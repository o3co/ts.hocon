name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Set version from tag
        # Idempotent: skip the bump if package.json is already at the tag's
        # version. `pnpm version X` errors with "Version not changed" if the
        # current version equals X, which broke v1.4.0 publish when the
        # release-prep PR pre-bumped package.json (see scope AGENTS.md
        # "Release version-bump convention").
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$CURRENT" ]; then
            pnpm version "$TAG_VERSION" --no-git-tag-version --no-commit-hooks
          else
            echo "package.json already at $CURRENT — skipping bump"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch expected JSON
        # xx.hocon ground-truth fixtures used by the conformance tests
        # (e.g. tests/lightbend/testdata/expected/unquoted-starts/*.json).
        # Without this step the test job fails with ENOENT before publish
        # — see #98 release-time regression where v1.2.0 publish was blocked.
        run: make testdata

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish
        run: pnpm publish --access public --no-git-checks --provenance

      - name: Extract CHANGELOG section for this tag
        # Pulls the section between `## [VERSION]` and the next `## [`
        # from CHANGELOG.md so the GitHub Release body matches what's
        # already committed and reviewed.
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { flag=0 }
            flag
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for v${VERSION}; release body will be empty"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          fail_on_unmatched_files: false
          make_latest: true
